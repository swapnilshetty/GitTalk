services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gittalk-postgres

    environment:
      POSTGRES_DB: gittalk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}

    ports:
      - "5433:5432"

    volumes:
      - gittalk_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gittalk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gittalk_pg_data: